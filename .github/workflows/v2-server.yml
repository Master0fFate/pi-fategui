name: V2 source verification

# Deliberately manual while native release/platform gates remain unaccepted.
# This workflow creates no installers, packages, releases, credentials or deployments.
on:
  workflow_dispatch:
    inputs:
      browser:
        description: Also install the pinned Chromium test dependency and run browser workflows
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: v2-source-verification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-source:
    name: Linux x64 / Node source checks
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.17.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
      - name: Verify target identity
        run: node -e "if (process.platform !== 'linux' || process.arch !== 'x64') throw new Error('Expected native Linux x64');"
      - name: Configure local test browser cache
        run: echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/fate-chromium" >> "$GITHUB_ENV"
      - name: Install frozen test dependencies
        run: pnpm install --frozen-lockfile
      - name: Run isolated source, contract, unit and local-network gates
        run: pnpm verify:v2 --scope core
      - name: Install pinned test browser
        if: inputs.browser
        run: pnpm exec playwright install chromium
      - name: Run actual browser workflows
        if: inputs.browser
        run: pnpm test:web
      - name: Record exact candidate and remaining gates
        if: always()
        shell: bash
        run: |
          {
            echo "Candidate: $GITHUB_SHA"
            echo "Scope: Linux x64 source checks only"
            echo "Browser requested: ${{ inputs.browser }}"
            echo "Native desktop, Windows/macOS, real SSH/systemd, package notices/artifacts and human acceptance remain separate gates."
            echo "No private profiles or failure fixture roots are uploaded."
          } >> "$GITHUB_STEP_SUMMARY"
