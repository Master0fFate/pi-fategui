name: Windows package check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  verify-package:
    name: ${{ matrix.label }} / Node 22
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-2025
            platform: win32
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.17.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.19.0
          cache: pnpm
      - name: Assert native runner architecture
        shell: bash
        run: node -e "if (process.platform !== '${{ matrix.platform }}' || process.arch !== '${{ matrix.arch }}') throw new Error('Expected ${{ matrix.platform }}/${{ matrix.arch }}, received ' + process.platform + '/' + process.arch)"
      - name: Linux native prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential python3 xvfb
      - name: Install dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if pnpm install --frozen-lockfile; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            echo "Dependency install attempt $attempt failed; retrying registry downloads in 15 seconds."
            sleep 15
          done
      - name: Verify
        if: runner.os != 'Linux'
        run: pnpm verify
      - name: Verify on Linux display
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm verify
      - name: Build unpacked package
        if: runner.os != 'Linux'
        run: pnpm package
      - name: Build unpacked package on Linux display
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm package
      - name: Packaged smoke
        if: runner.os != 'Linux'
        run: pnpm smoke:packaged
      - name: Packaged smoke on Linux display
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm smoke:packaged
      - name: Build installer artifacts
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if pnpm dist:artifacts; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            echo "Installer build attempt $attempt failed; retrying transient tool downloads in 15 seconds."
            sleep 15
          done
      - name: Stage public artifacts only
        run: node scripts/release-artifacts.mjs stage --source release --output artifacts --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fate-ui-${{ matrix.platform }}-${{ matrix.arch }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: verify-package
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release tag and source branch
        run: |
          node scripts/release-artifacts.mjs validate-tag --tag "$GITHUB_REF_NAME"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: fate-ui-*
          path: artifacts
          merge-multiple: true
      - name: Verify release set and write checksums
        run: |
          test "$(find artifacts -maxdepth 1 -type f | wc -l)" -eq 1
          node scripts/release-artifacts.mjs checksums --source artifacts
      - name: Publish verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" artifacts/* --draft --verify-tag --generate-notes --title "Fate UI $GITHUB_REF_NAME"
          fi
          gh release edit "$GITHUB_REF_NAME" --draft=false
