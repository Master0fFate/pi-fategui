name: Cross-platform

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-package:
    name: ${{ matrix.os }} / Node 22
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.13.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.19.0
          cache: pnpm
      - name: Linux native prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential python3 xvfb
      - run: pnpm install --frozen-lockfile
      - name: Verify
        if: runner.os != 'Linux'
        run: pnpm verify
      - name: Verify on Linux display
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm verify
      - run: pnpm package
      - name: Packaged smoke
        if: runner.os != 'Linux'
        run: pnpm smoke:packaged
      - name: Packaged smoke on Linux display
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm smoke:packaged
      - name: Build installer artifact
        run: pnpm dist:artifacts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pi-desktop-${{ runner.os }}-${{ runner.arch }}
          path: release/
          if-no-files-found: error
          retention-days: 7
