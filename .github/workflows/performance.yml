name: Renderer performance profiles

on:
  pull_request:
    paths:
      - '.github/workflows/performance.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'scripts/profile-live-renderer.mjs'
      - 'src/main/pi/PiEventBatcher.ts'
      - 'src/renderer/**'
      - 'tests/e2e/**'
      - 'vite.e2e.config.ts'
      - 'vite.main.config.ts'
      - 'vite.preload.config.ts'
      - 'vite.renderer.config.ts'
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: Version tag or commit to compare against (defaults to the nearest version tag)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: renderer-performance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  profile:
    name: ${{ matrix.label }} live renderer profile
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-2025
            artifact: windows-x64
          - label: macOS Apple Silicon
            os: macos-15
            artifact: macos-arm64
          - label: macOS Intel
            os: macos-15-intel
            artifact: macos-x64
          - label: Linux x64
            os: ubuntu-22.04
            artifact: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Configure isolated performance data directory
        shell: bash
        run: echo "FATE_GUI_DATA_DIR=$RUNNER_TEMP/fate-ui-performance" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.17.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
          cache: pnpm
      - name: Linux native prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential python3 xvfb
      - name: Compare all visual modes on the same native runner
        shell: bash
        env:
          BASELINE_REF: ${{ inputs.baseline_ref }}
        run: |
          set -euo pipefail
          candidate=$(git rev-parse HEAD)
          baseline=$(git rev-parse --verify --end-of-options "${BASELINE_REF:-$(git describe --tags --match 'v*' --abbrev=0)}^{commit}")
          mkdir -p .parallax/performance
          cp scripts/profile-live-renderer.mjs .parallax/performance/profile-compare.mjs
          printf '{"baseline":"%s","candidate":"%s"}\n' "$baseline" "$candidate" > .parallax/performance/revisions.json
          display=()
          if [ "$RUNNER_OS" = Linux ]; then display=(xvfb-run -a); fi
          for phase in before after; do
            revision="$baseline"
            if [ "$phase" = after ]; then revision="$candidate"; fi
            git checkout --detach "$revision"
            pnpm install --frozen-lockfile
            pnpm build:e2e
            for mode in normal performance holy; do
              output=".parallax/performance/${{ matrix.artifact }}-$phase-$mode.json"
              "${display[@]}" node .parallax/performance/profile-compare.mjs --runs 3 --mode "$mode" --idle-ms 2000 --label "$phase-$mode" --out "$output"
              node --input-type=module -e 'import fs from "node:fs"; const p = JSON.parse(fs.readFileSync(process.argv[1])); if (p.summary.totalConsoleErrors) throw new Error("Renderer errors during profile");' "$output"
            done
          done
      - name: Upload performance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fate-ui-performance-${{ matrix.artifact }}
          path: .parallax/performance/
          if-no-files-found: warn
          retention-days: 14
